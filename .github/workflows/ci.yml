name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: airquality
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  PGPASSWORD: postgres

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Pinned: ruff widens its default rules between releases. Rules live in ruff.toml.
      - run: pip install ruff==0.17.3
      - run: ruff check ingestion/ api/ tests/

  pytest:
    name: pytest (unit + Postgres integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airquality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create raw schema and tables
        run: psql -h localhost -U postgres -d airquality -v ON_ERROR_STOP=1 -f scripts/init_db.sql
      - name: Run pytest
        env:
          WAQI_TOKEN: dummy-token-for-tests
          AIRPULSE_TEST_DB: "1" # enables tests/test_db_integration.py against the service container
        run: pytest -v

  dbt:
    name: dbt build + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airquality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create raw schema and tables
        run: psql -h localhost -U postgres -d airquality -v ON_ERROR_STOP=1 -f scripts/init_db.sql
      - name: Seed synthetic fixture (see ci/seed_fixture.sql)
        run: psql -h localhost -U postgres -d airquality -v ON_ERROR_STOP=1 -f ci/seed_fixture.sql
      - name: dbt build (models + schema tests + custom test)
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: Assert model outputs against the fixture
        run: psql -h localhost -U postgres -d airquality -v ON_ERROR_STOP=1 -f ci/assert_pipeline.sql
      - name: Generate dbt docs catalog
        working-directory: dbt
        run: dbt docs generate --profiles-dir .
      - uses: actions/upload-artifact@v7
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json
          retention-days: 14
